# Production override for Dokploy: puts only the public service on dokploy-network so Traefik
# can route to it. db, redis and cron stay on the project network, so their generic names
# can't clash with other projects on the shared network.

services:
  nextcloud:
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true
