# Production override for Dokploy deployment
# Only nextcloud joins dokploy-network so Traefik can route to it. db, redis
# and cron stay on the project's private default network (see
# projects/adr/0001). Note: giving a service an explicit `networks:` key drops
# it off the implicit default network, so nextcloud lists `default` too.

services:
  nextcloud:
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true
