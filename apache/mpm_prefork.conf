# Replaces the image's mpm_prefork.conf (MaxRequestWorkers 150). Each worker
# is a PHP process allowed 512M, far more than the Pi can back at once.
# Extra requests queue instead of piling up workers; the web UI keeps working
# since most requests finish in well under a second.
<IfModule mpm_prefork_module>
	StartServers            3
	MinSpareServers         2
	MaxSpareServers         6
	MaxRequestWorkers       16
	# Recycle workers so a leaky request doesn't hold its memory forever
	MaxConnectionsPerChild  500
</IfModule>
